name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  OSS_CAD_SUITE: "2026-10-23"

jobs:
  software:
    name: Compiler and simulator
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sim.txt
      - run: pip install -r requirements-sim.txt
      - name: Unit tests (ISA, TFLite-exact requant, compiler + simulator)
        run: cd sw && python -m pytest -q tests
      - name: Compile VWW
        run: |
          cd sw
          python -m npu.compiler ../models/ir/vww --out ../build/npu_vww > ../build/compile.log
          tail -1 ../build/compile.log >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: vww-program
          path: build/npu_vww

  rtl:
    name: RTL (Verilator + cocotb)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-sim.txt
      - run: pip install -r requirements-sim.txt
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Lint
        run: make lint TOOLS=
      - name: cocotb tests (random networks, board system over flash and SDRAM)
        run: cd tb && python -m pytest -q -ra

  bitstream:
    name: Tang Nano 20K bitstream
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: ${{ env.OSS_CAD_SUITE }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Synthesis, place and route (54 MHz)
        shell: bash          # -o pipefail: a failed build fails the step despite tee
        run: make -C fpga/tangnano20k TOP=npu_board_top FREQ_MHZ=54 ENV= | tee build.log
      - name: Summary
        run: |
          {
            echo '### npu_board_top'
            echo '```'
            sed -n '/--- npu_board_top/,$p' build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: npu_board_top-bitstream
          path: |
            fpga/tangnano20k/build/npu_board_top/npu_board_top.fs
            fpga/tangnano20k/build/npu_board_top/nextpnr.log

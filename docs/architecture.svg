<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 480" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 L3,5 z" fill="#000"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="940" height="480" fill="#fff"/>

  <!-- PC -->
  <rect x="10" y="10" width="240" height="250" fill="none" stroke="#000"/>
  <text x="18" y="27" font-weight="bold">PC (Python)</text>
  <rect x="40" y="45" width="180" height="34" fill="#f5f5f5" stroke="#666"/>
  <text x="130" y="66" text-anchor="middle">TFLite model → IR</text>
  <rect x="40" y="110" width="180" height="34" fill="#f5f5f5" stroke="#666"/>
  <text x="130" y="131" text-anchor="middle">compiler</text>
  <rect x="25" y="180" width="95" height="44" fill="#f5f5f5" stroke="#666"/>
  <text x="72" y="199" text-anchor="middle">simulator</text>
  <text x="72" y="214" text-anchor="middle">(cycle exact)</text>
  <rect x="140" y="180" width="95" height="44" fill="#f5f5f5" stroke="#666"/>
  <text x="187" y="199" text-anchor="middle">flash image</text>
  <text x="187" y="214" text-anchor="middle">(.bin)</text>
  <path d="M130,79 V110" stroke="#000" fill="none" marker-end="url(#a)"/>
  <path d="M100,144 V162 H72 V180" stroke="#000" fill="none" marker-end="url(#a)"/>
  <path d="M160,144 V162 H187 V180" stroke="#000" fill="none" marker-end="url(#a)"/>

  <!-- board -->
  <rect x="270" y="10" width="660" height="460" fill="none" stroke="#000"/>
  <text x="278" y="27" font-weight="bold">Tang Nano 20K (GW2AR-18)</text>

  <rect x="290" y="180" width="120" height="44" fill="#fff2cc" stroke="#d6b656"/>
  <text x="350" y="199" text-anchor="middle">SPI flash</text>
  <text x="350" y="214" text-anchor="middle">8 MB</text>
  <rect x="290" y="280" width="120" height="44" fill="#fff2cc" stroke="#d6b656"/>
  <text x="350" y="299" text-anchor="middle">SDRAM</text>
  <text x="350" y="314" text-anchor="middle">(weights)</text>
  <rect x="290" y="380" width="120" height="44" fill="#d5e8d4" stroke="#82b366"/>
  <text x="350" y="399" text-anchor="middle">UART</text>
  <text x="350" y="414" text-anchor="middle">1 Mbaud</text>

  <path d="M235,202 H290" stroke="#000" fill="none" marker-end="url(#a)"/>
  <text x="262" y="196" text-anchor="middle" font-size="11">USB</text>
  <path d="M350,224 V280" stroke="#000" fill="none" marker-end="url(#a)"/>
  <text x="356" y="256" font-size="11">copy at boot</text>

  <!-- NPU -->
  <rect x="440" y="40" width="470" height="340" fill="none" stroke="#000"/>
  <text x="448" y="57" font-weight="bold">npu_core</text>
  <rect x="470" y="70" width="410" height="30" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="675" y="89" text-anchor="middle">sequencer (1 instruction per layer)</text>

  <rect x="460" y="300" width="150" height="50" fill="#fff2cc" stroke="#d6b656"/>
  <text x="535" y="321" text-anchor="middle">activation memory</text>
  <text x="535" y="336" text-anchor="middle">56 KiB</text>

  <rect x="640" y="160" width="110" height="50" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="695" y="181" text-anchor="middle">tile engine</text>
  <text x="695" y="196" text-anchor="middle">im2col + transpose</text>

  <rect x="790" y="140" width="100" height="90" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="840" y="181" text-anchor="middle">8x8 MAC</text>
  <text x="840" y="196" text-anchor="middle">array</text>

  <rect x="780" y="300" width="110" height="50" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="835" y="321" text-anchor="middle">requant x2</text>
  <text x="835" y="336" text-anchor="middle">(sum → int8)</text>

  <!-- datapath -->
  <path d="M535,300 V185 H640" stroke="#000" fill="none" marker-end="url(#a)"/>
  <path d="M530,248 l10,-8" stroke="#000"/>
  <text x="545" y="244" font-size="11">64</text>
  <path d="M750,185 H790" stroke="#000" fill="none" marker-end="url(#a)"/>
  <path d="M840,230 V300" stroke="#000" fill="none" marker-end="url(#a)"/>
  <text x="846" y="268" font-size="11">sums</text>
  <path d="M780,325 H610" stroke="#000" fill="none" marker-end="url(#a)"/>
  <path d="M690,330 l10,-10" stroke="#000"/>
  <text x="704" y="318" font-size="11">64</text>
  <text x="695" y="343" text-anchor="middle" font-size="11">next layer</text>

  <path d="M410,302 H425 V125 H840 V140" stroke="#000" fill="none" stroke-dasharray="4 3" marker-end="url(#a)"/>
  <path d="M630,130 l10,-10" stroke="#000"/>
  <text x="644" y="120" font-size="11">64</text>
  <text x="700" y="120" font-size="11">weights + params</text>

  <path d="M410,402 H435 V340 H460" stroke="#000" fill="none" marker-end="url(#a)"/>
  <text x="418" y="396" font-size="11">image</text>

  <!-- output -->
  <rect x="780" y="410" width="110" height="40" fill="#d5e8d4" stroke="#82b366"/>
  <text x="835" y="434" text-anchor="middle">HDMI out</text>
  <path d="M835,350 V410" stroke="#000" fill="none" marker-end="url(#a)"/>
  <text x="841" y="386" font-size="11">result</text>
</svg>

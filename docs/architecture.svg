<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 490" role="img" aria-label="Data flow: the Python compiler writes a flash image; at boot the weights are copied from SPI flash into SDRAM; in the NPU core, feature maps loop from activation memory through the tile engine, the 8x8 MAC array and the requantizers back into activation memory, one layer per instruction, while weights stream in from SDRAM.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #f6f8fa; stroke: #57606a; stroke-width: 1.2; }
    .region { fill: none; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .core { fill: #fff8f0; stroke: #d4731a; stroke-width: 1.6; }
    .accent { fill: #fdebd9; stroke: #d4731a; stroke-width: 1.4; }
    .t { fill: #1f2328; font: 13px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .s { fill: #57606a; font: 11px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; text-anchor: middle; }
    .h { fill: #57606a; font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .hc { fill: #b85f10; font: 600 12px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .w { fill: none; stroke: #57606a; stroke-width: 1.4; }
    .wd { fill: none; stroke: #57606a; stroke-width: 1.4; stroke-dasharray: 5 3; }
    .loop { fill: none; stroke: #d4731a; stroke-width: 2; }
    .ah { fill: #57606a; }
    .ahc { fill: #d4731a; }
    .cell { fill: #d4731a; opacity: 0.55; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .box { fill: #161b22; stroke: #8b949e; }
      .region { stroke: #6e7681; }
      .core { fill: #1c1610; stroke: #f0883e; }
      .accent { fill: #2d1d0e; stroke: #f0883e; }
      .t { fill: #e6edf3; }
      .s, .h { fill: #8b949e; }
      .hc { fill: #f0883e; }
      .w, .wd { stroke: #8b949e; }
      .ah { fill: #8b949e; }
      .loop { stroke: #f0883e; }
      .ahc, .cell { fill: #f0883e; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ahc" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>
  <rect class="bg" x="0" y="0" width="960" height="490" rx="10"/>

  <!-- host -->
  <rect class="region" x="20" y="40" width="250" height="230" rx="8"/>
  <text class="h" x="34" y="62">PC (Python)</text>
  <rect class="box" x="40" y="76" width="210" height="36" rx="6"/>
  <text class="t" x="145" y="99">model.tflite → IR</text>
  <rect class="box" x="40" y="136" width="210" height="36" rx="6"/>
  <text class="t" x="145" y="159">compiler</text>
  <rect class="box" x="40" y="200" width="100" height="44" rx="6"/>
  <text class="t" x="90" y="219">simulator</text>
  <text class="s" x="90" y="235">same math, cycles</text>
  <rect class="box" x="150" y="200" width="100" height="44" rx="6"/>
  <text class="t" x="200" y="219">flash image</text>
  <text class="s" x="200" y="235">program + weights</text>
  <path class="w" d="M145,112 V134" marker-end="url(#a)"/>
  <path class="w" d="M90,172 V198" marker-end="url(#a)"/>
  <path class="w" d="M200,172 V198" marker-end="url(#a)"/>

  <!-- board -->
  <rect class="region" x="290" y="40" width="650" height="430" rx="8"/>
  <text class="h" x="304" y="62">Tang Nano 20K (GW2AR-18)</text>
  <rect class="box" x="310" y="200" width="140" height="44" rx="6"/>
  <text class="t" x="380" y="219">SPI flash</text>
  <text class="s" x="380" y="235">bitstream + model</text>
  <rect class="box" x="310" y="270" width="140" height="44" rx="6"/>
  <text class="t" x="380" y="289">SDRAM</text>
  <text class="s" x="380" y="305">weights</text>
  <rect class="box" x="310" y="350" width="140" height="44" rx="6"/>
  <text class="t" x="380" y="369">USB-UART</text>
  <text class="s" x="380" y="385">1 Mbaud</text>
  <path class="w" d="M250,222 H308" marker-end="url(#a)"/>
  <text class="s" x="279" y="214">write</text>
  <path class="w" d="M380,244 V268" marker-end="url(#a)"/>
  <text class="s" x="424" y="261">copy at boot</text>

  <!-- NPU core -->
  <rect class="core" x="490" y="60" width="436" height="340" rx="8"/>
  <text class="hc" x="504" y="82">NPU core</text>
  <rect class="box" x="510" y="92" width="400" height="30" rx="6"/>
  <text class="t" x="710" y="112">sequencer: one instruction per layer</text>

  <rect class="accent" x="510" y="320" width="150" height="64" rx="6"/>
  <text class="t" x="585" y="346">activation memory</text>
  <text class="s" x="585" y="363">56 KiB, feature maps</text>

  <rect class="accent" x="690" y="170" width="120" height="52" rx="6"/>
  <text class="t" x="750" y="192">tile engine</text>
  <text class="s" x="750" y="209">8 px × 8 ch jobs</text>

  <rect class="accent" x="830" y="160" width="84" height="120" rx="6"/>
  <text class="t" x="872" y="180">8×8 MAC</text>
  <g>
    <rect class="cell" x="845" y="190" width="5" height="5"/><rect class="cell" x="852" y="190" width="5" height="5"/><rect class="cell" x="859" y="190" width="5" height="5"/><rect class="cell" x="866" y="190" width="5" height="5"/><rect class="cell" x="873" y="190" width="5" height="5"/><rect class="cell" x="880" y="190" width="5" height="5"/><rect class="cell" x="887" y="190" width="5" height="5"/><rect class="cell" x="894" y="190" width="5" height="5"/>
    <rect class="cell" x="845" y="197" width="5" height="5"/><rect class="cell" x="852" y="197" width="5" height="5"/><rect class="cell" x="859" y="197" width="5" height="5"/><rect class="cell" x="866" y="197" width="5" height="5"/><rect class="cell" x="873" y="197" width="5" height="5"/><rect class="cell" x="880" y="197" width="5" height="5"/><rect class="cell" x="887" y="197" width="5" height="5"/><rect class="cell" x="894" y="197" width="5" height="5"/>
    <rect class="cell" x="845" y="204" width="5" height="5"/><rect class="cell" x="852" y="204" width="5" height="5"/><rect class="cell" x="859" y="204" width="5" height="5"/><rect class="cell" x="866" y="204" width="5" height="5"/><rect class="cell" x="873" y="204" width="5" height="5"/><rect class="cell" x="880" y="204" width="5" height="5"/><rect class="cell" x="887" y="204" width="5" height="5"/><rect class="cell" x="894" y="204" width="5" height="5"/>
    <rect class="cell" x="845" y="211" width="5" height="5"/><rect class="cell" x="852" y="211" width="5" height="5"/><rect class="cell" x="859" y="211" width="5" height="5"/><rect class="cell" x="866" y="211" width="5" height="5"/><rect class="cell" x="873" y="211" width="5" height="5"/><rect class="cell" x="880" y="211" width="5" height="5"/><rect class="cell" x="887" y="211" width="5" height="5"/><rect class="cell" x="894" y="211" width="5" height="5"/>
    <rect class="cell" x="845" y="218" width="5" height="5"/><rect class="cell" x="852" y="218" width="5" height="5"/><rect class="cell" x="859" y="218" width="5" height="5"/><rect class="cell" x="866" y="218" width="5" height="5"/><rect class="cell" x="873" y="218" width="5" height="5"/><rect class="cell" x="880" y="218" width="5" height="5"/><rect class="cell" x="887" y="218" width="5" height="5"/><rect class="cell" x="894" y="218" width="5" height="5"/>
    <rect class="cell" x="845" y="225" width="5" height="5"/><rect class="cell" x="852" y="225" width="5" height="5"/><rect class="cell" x="859" y="225" width="5" height="5"/><rect class="cell" x="866" y="225" width="5" height="5"/><rect class="cell" x="873" y="225" width="5" height="5"/><rect class="cell" x="880" y="225" width="5" height="5"/><rect class="cell" x="887" y="225" width="5" height="5"/><rect class="cell" x="894" y="225" width="5" height="5"/>
    <rect class="cell" x="845" y="232" width="5" height="5"/><rect class="cell" x="852" y="232" width="5" height="5"/><rect class="cell" x="859" y="232" width="5" height="5"/><rect class="cell" x="866" y="232" width="5" height="5"/><rect class="cell" x="873" y="232" width="5" height="5"/><rect class="cell" x="880" y="232" width="5" height="5"/><rect class="cell" x="887" y="232" width="5" height="5"/><rect class="cell" x="894" y="232" width="5" height="5"/>
    <rect class="cell" x="845" y="239" width="5" height="5"/><rect class="cell" x="852" y="239" width="5" height="5"/><rect class="cell" x="859" y="239" width="5" height="5"/><rect class="cell" x="866" y="239" width="5" height="5"/><rect class="cell" x="873" y="239" width="5" height="5"/><rect class="cell" x="880" y="239" width="5" height="5"/><rect class="cell" x="887" y="239" width="5" height="5"/><rect class="cell" x="894" y="239" width="5" height="5"/>
  </g>
  <text class="s" x="872" y="264">+ depthwise</text>

  <rect class="accent" x="800" y="330" width="114" height="48" rx="6"/>
  <text class="t" x="857" y="351">2× requant</text>
  <text class="s" x="857" y="367">back to int8</text>

  <!-- the layer loop -->
  <path class="loop" d="M585,320 V196 H688" marker-end="url(#ac)"/>
  <text class="s" x="632" y="262">input windows</text>
  <path class="loop" d="M810,196 H828" marker-end="url(#ac)"/>
  <path class="loop" d="M872,280 V328" marker-end="url(#ac)"/>
  <text class="s" x="896" y="308">sums</text>
  <path class="loop" d="M800,352 H662" marker-end="url(#ac)"/>
  <text class="s" x="731" y="344">int8 → next layer</text>

  <!-- weights and images -->
  <path class="wd" d="M450,292 H470 V142 H872 V158" marker-end="url(#a)"/>
  <text class="s" x="671" y="136">weights stream in during each layer</text>
  <path class="w" d="M450,372 H508" marker-end="url(#a)"/>
  <text class="s" x="479" y="364">images</text>

  <!-- output -->
  <rect class="box" x="800" y="420" width="114" height="36" rx="6"/>
  <text class="t" x="857" y="443">HDMI overlay</text>
  <path class="w" d="M857,378 V418" marker-end="url(#a)"/>
  <text class="s" x="889" y="403">result</text>
</svg>
